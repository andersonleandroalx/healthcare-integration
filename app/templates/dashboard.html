
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Integration Monitor</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            background: #f1f5f9;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }

        h1 { margin-top: 0; }

        .subtitle {
            color: #64748b;
            margin-bottom: 24px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .column {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            min-height: 500px;
        }

        h2 {
            font-size: 18px;
            margin-top: 0;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-size: 14px;
            font-weight: bold;
        }

        input, button {
            width: 100%;
            padding: 11px;
            border-radius: 7px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
        }

        button {
            margin-top: 18px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background: #1d4ed8; }

        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            background: #e2e8f0;
            font-size: 12px;
        }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>Healthcare Integration Monitor</h1>
    <p class="subtitle">
        Observation event flow: API → SQLite Outbox → Kafka
    </p>

    <main class="dashboard">

        <section class="column">
            <h2>1. Send Observation</h2>

            <form id="observation-form">
                <label for="patient-id">Patient ID</label>
                <input id="patient-id" value="P-1001" required>

                <label for="test">Test</label>
                <input id="test" value="GLU" required>

                <label for="measurement">Measurement</label>
                <input id="measurement" value="mmol/L" required>

                <label for="glucose">Glucose (mmol/L)</label>
                <input id="glucose" type="number"
                       step="0.1" value="5.3" required>

                <button type="submit">Send Observation</button>
            </form>

            <p id="form-status">Waiting for submission...</p>
        </section>

        <section class="column">
            <h2>2. SQLite Outbox</h2>
            <span class="status" id="outbox-status">Waiting</span>
            <h3>Stored Event</h3>
            <pre id="outbox-data">No event stored yet.</pre>
        </section>

        <section class="column">
            <h2>3. Kafka Consumer</h2>
            <span class="status" id="kafka-status">Waiting</span>
            <h3>Received Message</h3>
            <pre id="kafka-data">No message received yet.</pre>
        </section>

    </main>

    <script>
        const form = document.getElementById("observation-form");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const payload = {
                patient_number: document.getElementById("patient-id").value,
                test: document.getElementById("test").value,
                result: Number(document.getElementById("glucose").value),
                measurement: document.getElementById("measurement").value
            };

            const status = document.getElementById("form-status");
            status.textContent = "Sending...";

            try {
                const response = await fetch("/events/observations/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(JSON.stringify(data));
                }

                status.textContent = "Observation sent successfully!";

                document.getElementById("outbox-data").textContent =
                    JSON.stringify(data, null, 2);

                document.getElementById("outbox-status").textContent =
                    "Submitted";

            } catch (error) {
                status.textContent = "Error: " + error.message;
            }
        });
    </script>
</body>

</html>
