
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Integration Monitor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #f1f5f9;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 24px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .column {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            min-height: 500px;
            overflow-wrap: anywhere;
        }

        h2 {
            font-size: 18px;
            margin-top: 0;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border-radius: 7px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 18px;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            background: #e2e8f0;
            font-size: 12px;
        }

        .history-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
        }

        .history-card small {
            color: #64748b;
        }

        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 12px;
            margin-bottom: 0;
        }

        .empty {
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Healthcare Integration Monitor</h1>

    <p class="subtitle">
        Observation event flow: API → SQLite Outbox → Kafka
    </p>

    <main class="dashboard">

        <!-- COLUMN 1: FORM -->

        <section class="column">
            <h2>1. Send Observation</h2>

            <form id="observation-form">

                <label for="patient-id">Patient ID</label>
                <input id="patient-id" value="P-1001" required>

                <label for="test">Test</label>
                <input id="test" value="GLU" required>

                <label for="glucose">Result</label>
                <input id="glucose"
                       type="number"
                       step="0.1"
                       value="5.3"
                       required>

                <label for="measurement">Measurement</label>
                <input id="measurement" value="mmol/L" required>

                <button id="submit-button" type="submit">
                    Send Observation
                </button>

            </form>

            <p id="form-status">Waiting for submission...</p>
        </section>


        <!-- COLUMN 2: OUTBOX -->

        <section class="column">
            <h2>2. SQLite Outbox</h2>

            <span class="status" id="outbox-status">
                Waiting
            </span>

            <div id="outbox-history">
                <p class="empty">No events stored yet.</p>
            </div>
        </section>


        <!-- COLUMN 3: KAFKA -->

        <section class="column">
            <h2>3. Kafka Consumer</h2>

            <span class="status" id="kafka-status">
                Connecting...
            </span>

            <div id="kafka-history">
                <p class="empty">No messages received yet.</p>
            </div>
        </section>

    </main>


    <script>

        // Add a new event to the history

        function addHistory(containerId, data) {

            const container = document.getElementById(containerId);

            const emptyMessage = container.querySelector(".empty");

            if (emptyMessage) {
                emptyMessage.remove();
            }

            const card = document.createElement("div");
            card.className = "history-card";

            const time = document.createElement("small");
            time.textContent = new Date().toLocaleTimeString();

            const content = document.createElement("pre");
            content.textContent = JSON.stringify(data, null, 2);

            card.appendChild(time);
            card.appendChild(content);

            container.prepend(card);
        }


        // FORM SUBMISSION

        const form = document.getElementById("observation-form");

        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            const button = document.getElementById("submit-button");
            const status = document.getElementById("form-status");

            const payload = {
                patient_number: document.getElementById("patient-id").value,
                test: document.getElementById("test").value,
                result: Number(document.getElementById("glucose").value),
                measurement: document.getElementById("measurement").value
            };

            button.disabled = true;
            status.textContent = "Sending...";

            try {

                const response = await fetch("/events/observations", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(JSON.stringify(data));
                }

                status.textContent = "Observation submitted successfully!";

                // Display the API response in the Outbox column
                addHistory("outbox-history", data);
                console.log("OUTBOX EVENT:", data);

                document.getElementById("outbox-status").textContent =
                    "Submitted";

            } catch (error) {

                status.textContent = "Error: " + error.message;

            } finally {

                button.disabled = false;

            }

        });


        // KAFKA WEBSOCKET

        const kafkaStatus = document.getElementById("kafka-status");

        const protocol = window.location.protocol === "https:"
            ? "wss:"
            : "ws:";

        const ws = new WebSocket(
            `${protocol}//${window.location.host}/ws/observations`
        );

        ws.onopen = () => {
            kafkaStatus.textContent = "Connected";
        };

        ws.onmessage = (event) => {

            try {

                const message = JSON.parse(event.data);

                addHistory("kafka-history", message);

                kafkaStatus.textContent = "Message received";

            } catch (error) {

                console.error("Invalid Kafka message:", error);

            }

        };

        ws.onerror = () => {
            kafkaStatus.textContent = "Connection error";
        };

        ws.onclose = () => {
            kafkaStatus.textContent = "Disconnected";
        };

    </script>

</body>
</html>
